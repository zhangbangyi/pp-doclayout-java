spring.application.name=pp-doclayout-web
# Web 服务监听端口；BrowserOpener 会根据实际端口生成首页地址。
server.port=8098
# 启动完成后是否尝试打开系统默认浏览器。
app.browser.auto-open=true
# 首次识别请求加载的 ONNX 模型路径。
app.model-path=models/inference.onnx
# ONNX Runtime 的算子内/算子间 CPU 线程数。
app.intra-threads=2
app.inter-threads=1
# 与 Controller 的 20 MB 图片大小限制保持一致。
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
